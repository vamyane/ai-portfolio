<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞书云文档转帝国后台一键排版工具 - 优化版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --success-color: #27ae60;
            --warning-color: #e67e22;
            --info-color: #16a085;
            --purple-color: #9b59b6;
            --background: #f8f9fa;
            --card-bg: #ffffff;
            --card-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans SC', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 30px;
            background: linear-gradient(135deg, #f0f5ff 0%, #e6f7ff 100%);
            color: var(--primary-color);
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
            padding: 20px 0;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 2.5rem;
            font-weight: 800;
            padding: 1rem 2rem;
            border-radius: var(--border-radius);
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.15);
        }

        .brand:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.25);
        }

        .brand i {
            font-size: 2.2rem;
            animation: pulse 2s infinite;
        }

        .sub-brand {
            font-size: 1.1rem;
            color: #7f8c8d;
            font-weight: 400;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 18px;
            border-radius: 30px;
            margin-top: 15px;
            display: inline-block;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 25px;
            max-width: 1800px;
            margin: 0 auto;
        }

        .editor-container {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--card-shadow);
            transition: var(--transition);
            height: 600px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(52, 152, 219, 0.1);
        }

        .editor-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.12);
        }

        .editor-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #3498db, #9b59b6);
            border-radius: var(--border-radius) var(--border-radius) 0 0;
        }

        h3 {
            margin: 0 0 15px;
            font-size: 1.3rem;
            color: var(--secondary-color);
            padding-bottom: 10px;
            border-bottom: 2px solid #e0f0ff;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        h3 i {
            font-size: 1.2em;
            color: #9b59b6;
        }

        .editor {
            flex: 1;
            overflow: auto;
            padding: 15px;
            border: 1px solid #e0f0ff;
            border-radius: 8px;
            background: white;
            font-size: 14px;
            line-height: 1.6;
            transition: border-color 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
        }

        .editor:focus {
            border-color: var(--secondary-color);
            outline: none;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px;
            justify-content: center;
            margin-bottom: 25px;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            max-width: 1400px;
            margin: 0 auto 30px;
            border: 1px solid rgba(52, 152, 219, 0.1);
        }

        .option-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(236, 245, 255, 0.4);
            align-items: center;
        }

        .option-group h4 {
            width: 100%;
            margin-bottom: 8px;
            color: #3498db;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option-group h4 i {
            color: #9b59b6;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            background: var(--secondary-color);
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 3px 8px rgba(52, 152, 219, 0.2);
            font-size: 14px;
            white-space: nowrap;
            position: relative;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            font-weight: bold;
            font-size: 16px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            background: rgba(52, 152, 219, 0.1);
            border-radius: 20px;
            transition: background 0.3s ease;
            cursor: pointer;
            user-select: none;
            font-size: 14px;
        }

        label:hover {
            background: rgba(52, 152, 219, 0.2);
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--secondary-color);
            cursor: pointer;
        }

        #sourceCode {
            background: #f8f9fa;
            white-space: pre-wrap;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            border: 1px solid #e0f0ff;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--secondary-color);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            animation: slideIn 0.3s ease;
            box-shadow: var(--card-shadow);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .btn-primary {
            background: var(--success-color);
            box-shadow: 0 3px 8px rgba(39, 174, 96, 0.2);
        }

        .btn-primary:hover {
            background: #219653;
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
        }

        .btn-warning {
            background: var(--warning-color);
            box-shadow: 0 3px 8px rgba(230, 126, 34, 0.2);
        }

        .btn-warning:hover {
            background: #d35400;
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.3);
        }

        .btn-info {
            background: var(--info-color);
            box-shadow: 0 3px 8px rgba(22, 160, 133, 0.2);
        }

        .btn-info:hover {
            background: #138a72;
            box-shadow: 0 5px 15px rgba(22, 160, 133, 0.3);
        }

        .btn-purple {
            background: var(--purple-color);
            box-shadow: 0 3px 8px rgba(155, 89, 182, 0.2);
        }

        .btn-purple:hover {
            background: #8e44ad;
            box-shadow: 0 5px 15px rgba(155, 89, 182, 0.3);
        }

        .btn-red {
            background: var(--accent-color);
            box-shadow: 0 3px 8px rgba(231, 76, 60, 0.2);
        }

        .btn-red:hover {
            background: #c0392b;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }

        .btn-yuloo {
            background: linear-gradient(135deg, #9b59b6, #3498db);
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(155, 89, 182, 0.3);
        }

        .btn-yuloo:hover {
            background: linear-gradient(135deg, #8e44ad, #2980b9);
            box-shadow: 0 6px 15px rgba(155, 89, 182, 0.4);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .pulse {
            animation: pulse 0.5s ease;
        }

        .feature-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--accent-color);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .fix-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #27ae60;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .status-badge {
            background: #3498db;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
            display: inline-block;
            align-self: flex-end;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .info-box {
            background-color: #e3f2fd;
            border-left: 4px solid #3498db;
            padding: 15px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
            font-size: 14px;
        }

        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 120px;
            background-color: #555;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -60px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 12px;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
            }
            
            .brand {
                font-size: 2rem;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            .brand {
                font-size: 1.8rem;
                padding: 0.8rem 1.5rem;
            }
            
            .editor-container {
                height: 500px;
            }
            
            .options {
                padding: 15px;
            }
            
            .option-group {
                width: 100%;
            }
        }
    </style>
</head>

    <div class="options">
        <div class="option-group">
            <h4><i class="fas fa-sliders-h"></i> 内容处理</h4>
            <label>
                <input type="checkbox" id="boldProcessing" checked>
                粗体
            </label>
            <label>
                <input type="checkbox" id="linkProcessing" checked>
                超链
            </label>
            <label>

                表格

            <label>
                <input type="checkbox" id="paragraphIndent" checked>
                空格
            </label>
        </div>
        
        <div class="option-group">
            <h4><i class="fas fa-table"></i> 表格处理</h4>
            <button onclick="applyTableLayout('fixed')"><i class="btn-icon">适</i> 页面自适应</button>
            <button onclick="applyTableLayout('auto')"><i class="btn-icon">文</i> 文字自适应</button>
            <button onclick="removeTableIndent()" class="btn-purple"><i class="btn-icon">缩</i> 取消缩进</button>
        </div>
        
        <div class="option-group">
            <h4><i class="fas fa-text-height"></i> 段落格式</h4>

        </div>
        
        <div class="option-group">

            <button onclick="removeComments()" class="btn-info"><i class="btn-icon">注</i> 清除注释</button>
            <button onclick="copySource()" class="btn-warning"><i class="btn-icon">复</i> 复制源码</button>
        </div>
    </div>

    <div class="container">

            </div>
            <div class="status-badge">可编辑区域</div>
        </div>
        
        <div class="editor-container">

            <div class="editor" id="outputArea"></div>

        </div>

        <div class="editor-container">
            <h3><i class="fas fa-code"></i> 源代码</h3>
            <pre class="editor" id="sourceCode"></pre>
            <div class="status-badge">HTML代码</div>
        </div>
    </div>

        h5.parentNode.replaceChild(h6, h5);
    });

    return tempDiv.innerHTML;

        // 核心处理流程
        function processContent() {
            // 在开始处理时重置当前文章颜色
            currentArticleColor = presetColors[Math.floor(Math.random() * presetColors.length)];
             
            let inputHTML = document.getElementById('inputArea').innerHTML;
            
            // 清理原始内容
            inputHTML = cleanFeishuSpecialSymbols(inputHTML);
           
            let content = cleanAttributes(inputHTML)
                .replace(/<div>/gi, '<p>')
                .replace(/<\/div>/gi, '</p>')
                .replace(/<(ol|ul)>/gi, '')
                .replace(/<\/(ol|ul)>/gi, '')
                .replace(/<li>/gi, '<p>')
                .replace(/<\/li>/gi, '</p>');

            // 处理表格前空白行
            content = content.replace(
                /<p>\s*(?:<!--.*?-->|<meta[^>]*>|<style>.*?<\/style>|<\/?byte-sheet[^>]*>)*\s*<\/p>(?=\s*<table)/gi, 
                ''
            );
            
            // 创建临时容器进行全面空白行处理
            const tempContainer = document.createElement('div');
            tempContainer.innerHTML = content;
            
            // 1. 处理无标签的连续空白（空格、换行等）
            function cleanTextNodes(node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    const trimmedContent = node.textContent.replace(/^\s+|\s+$/g, '');
                    // 压缩连续空白（多个空格、换行等变为一个空格）
                    node.textContent = trimmedContent.replace(/[\s\u3000]{2,}/g, ' ');
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    // 递归处理子节点
                    for (let i = 0; i < node.childNodes.length; i++) {
                        cleanTextNodes(node.childNodes[i]);
                    }
                }
            }
            cleanTextNodes(tempContainer);
            
            // 2. 处理BR标签和空段落
            function processBrsAndEmptyParagraphs() {
                // 找到所有的br标签
                const brElements = tempContainer.querySelectorAll('br');
                
                // 处理br标签前后的空白
                brElements.forEach(br => {
                    // 删除br标签前后的纯空白文本节点
                    let prev = br.previousSibling;
                    let next = br.nextSibling;
                    
                    if (prev && prev.nodeType === Node.TEXT_NODE && /^\s*$/.test(prev.textContent)) {
                        prev.remove();
                    }
                    
                    if (next && next.nodeType === Node.TEXT_NODE && /^\s*$/.test(next.textContent)) {
                        next.remove();
                    }
                });
                
                // 删除所有空的段落（包括只包含BR标签的情况）
                tempContainer.querySelectorAll('p').forEach(p => {
                    let isOnlyBr = true;
                    let hasNonBlankText = false;
                    
                    // 检查段落内容
                    for (const child of p.childNodes) {
                        if (child.nodeType === Node.TEXT_NODE) {
                            // 如果有非空白文本
                            if (child.textContent.trim() !== '') {
                                hasNonBlankText = true;
                            }
                        } else if (child.nodeType === Node.ELEMENT_NODE) {
                            // 如果不是BR标签，则不视为"纯BR"段落
                            if (child.tagName !== 'BR' && 
                                !['IMG', 'TABLE', 'IFRAME', 'HR'].includes(child.tagName)) {
                                isOnlyBr = false;
                            }
                        }
                    }
                    
                    // 删除空的段落和只包含一个或多个BR标签的段落
                    const isEmpty = !hasNonBlankText && (isOnlyBr || p.textContent.trim() === '');
                    if (isEmpty && !p.querySelector('img, table, iframe, hr')) {
                        p.remove();
                    }
                });
                
                // 处理连续的多个br标签
                const allBrGroups = [];
                let currentBrGroup = [];
                
                // 递归查找连续的br标签
                function findBrGroups(node) {
                    if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'BR') {
                        currentBrGroup.push(node);
                    } else {
                        if (currentBrGroup.length > 1) {
                            allBrGroups.push([...currentBrGroup]);
                        }
                        currentBrGroup = [];
                        
                        if (node.childNodes) {
                            for (const child of node.childNodes) {
                                findBrGroups(child);
                            }
                        }
                    }
                }
                findBrGroups(tempContainer);
                
                // 压缩连续的br标签组（保留一个）
                allBrGroups.forEach(brGroup => {
                    if (brGroup.length > 1) {
                        // 保留第一个br，删除后续的br
                        for (let i = 1; i < brGroup.length; i++) {
                            brGroup[i].remove();
                        }
                    }
                });
            }
            processBrsAndEmptyParagraphs();
            
            // 3. 删除其他空元素
            const emptyElements = ['div', 'span', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6'];
            emptyElements.forEach(tag => {
                tempContainer.querySelectorAll(tag).forEach(el => {
                    // 检查元素内容是否为空
                    if (el.textContent.trim() === '' && 
                        el.querySelectorAll(':not(br)').length === 0 && // 不包含除br外的元素
                        el.childElementCount === (el.querySelectorAll('br').length) // 所有子元素都是br
                        ) {
                        el.remove();
                    }
                });
            });
            
            // 4. 压缩多个相邻的空行（无标签空行）
            let previousNode = null;
            Array.from(tempContainer.childNodes).forEach(node => {
                // 检查是否是无标签的空白行（如连续的换行符）
                if (node.nodeType === Node.TEXT_NODE && /^\s+$/.test(node.textContent)) {
                    // 如果前一个节点也是空节点，则删除当前节点
                    if (previousNode && previousNode.nodeType === Node.TEXT_NODE && 
                        /^\s+$/.test(previousNode.textContent)) {
                        node.remove();
                    } else {
                        previousNode = node;
                    }
                } else {
                    previousNode = null;
                }
            });
            
            // 5. 处理表格前的空白行
            tempContainer.querySelectorAll('table').forEach(table => {
                let prev = table.previousSibling;
                while (prev) {
                    // 删除表格前的空段落
                    if (prev.nodeType === Node.ELEMENT_NODE && 
                        prev.tagName === 'P' && 
                        /^[\s\u3000]*$/.test(prev.textContent)) {
                        const toRemove = prev;
                        prev = prev.previousSibling;
                        toRemove.remove();
                    } 
                    // 删除表格前的文本空行
                    else if (prev.nodeType === Node.TEXT_NODE && 
                             /^\s+$/.test(prev.textContent)) {
                        const toRemove = prev;
                        prev = prev.previousSibling;
                        toRemove.remove();
                    } 
                    // 遇到非空节点则停止
                    else {
                        break;
                    }
                }
            });
            
            content = tempContainer.innerHTML;
            
            // 6. 压缩多个连续的空段落为最多一个空白行
            content = content.replace(/(<p>\s*<\/p>\s*){2,}/gi, '<p>&nbsp;</p>');
            
            // 处理链接
            if(document.getElementById('linkProcessing').checked) {
                content = processLinkAttributes(content);
            }

            // 处理表格
            content = document.getElementById('tableProcessing').checked ? 
                processTables(content) : 
                content.replace(/<table[\s\S]*?<\/table>/gi, '');
                
            // 根据复选框状态处理段首空格
            if(document.getElementById('paragraphIndent').checked) {
                // 普通段落添加空格
                content = content.replace(/<p>/g, '<p>　　');
                
                // 处理表格内的段落
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = content;
                tempDiv.querySelectorAll('td p, th p').forEach(p => {
                    p.innerHTML = '　　' + p.innerHTML;
                });
                content = tempDiv.innerHTML;
            }

            document.getElementById('outputArea').innerHTML = content;
            updateSourceCode();
            
            // 清除注释
            removeCommentsFromOutput();
        }

        // 清除乱码功能
        function removeEmptySpans() {
            const inputArea = document.getElementById('inputArea');
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = inputArea.innerHTML;
            
            // 查找所有span标签
            const spans = tempDiv.querySelectorAll('span');
            
            let count = 0;
            spans.forEach(span => {
                if (!span.textContent.trim()) {
                    const textNode = document.createTextNode(span.textContent);
                    span.parentNode.replaceChild(textNode, span);
                    count++;
                }
            });
            
            inputArea.innerHTML = tempDiv.innerHTML;
            showNotification(`🧹 已清除 ${count} 个空span标签`);
        }

        // 清理飞书特殊符号
        function cleanFeishuSpecialSymbols(html) {
            let cleaned = html.replace(/\{\"text\":\"(.*?)\",.*?\}/g, (match, p1) => {
                return p1.replace(/\\\"/g, '"');
            });
            
            cleaned = cleaned.replace(/\s*<{3,}\s*([^>]+)\s*>{3,}\s*/g, '$1');
            cleaned = cleaned.replace(/data-lark-record-format="[^"]*"/g, '');
            cleaned = cleaned.replace(/class="lark-record-clipboard"/g, '');
            cleaned = cleaned.replace(/\s*"\s*\}\s*,\s*"attribs[^"]*"[^}]*\}\s*\}\s*/g, '');
            
            return cleaned;
        }

        function cleanAttributes(html) {
            if(!document.getElementById('boldProcessing').checked) {
                html = html.replace(/<(strong|b)>/gi, '')
                          .replace(/<\/(strong|b)>/gi, '');
            }

            if(!document.getElementById('linkProcessing').checked) {
                html = html.replace(/<a\s+[^>]*>/gi, '')
                          .replace(/<\/a>/gi, '');
            }

            return html.replace(/<(\w+)(\s+[^>]*)?>/g, (match, tag, attrs) => {
                const tagLower = tag.toLowerCase();
                if (tagLower === 'a' && document.getElementById('linkProcessing').checked) {
                    const href = (attrs?.match(/href\s*=\s*["']([^"']*)["']/i) || [])[1] || '';
                    return `<a href="${href}">`;
                }
                return `<${tag}>`;
            });
        }

        // 表格处理（使用统一颜色）
        function processTables(html) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;

            // 使用当前文章的统一颜色
            const tableColor = currentArticleColor;

            tempDiv.querySelectorAll('table').forEach(table => {
                // 处理首行
                const firstRow = table.rows[0];
                Array.from(firstRow.cells).forEach(td => {
                    const th = document.createElement('th');
                    th.innerHTML = `<span style="text-wrap-mode: wrap; color: #FFFFFF;">${td.innerHTML}</span>`;
                    firstRow.replaceChild(th, td);
                });

                // 应用样式
                const cells = table.querySelectorAll('th, td');
                
                cells.forEach(cell => {
                    cell.style.borderColor = 'rgb(221, 221, 221)';
                    if (cell.tagName === 'TD') {
                        cell.setAttribute('align', 'center');
                        cell.setAttribute('valign', 'middle');
                    } else {
                        cell.style.backgroundColor = tableColor;
                    }
                });
            });

            return tempDiv.innerHTML;
        }

        // 链接处理
        function processLinkAttributes(html) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            
            tempDiv.querySelectorAll('a').forEach(a => {
                a.className = 'yuloo_article_link';
                
                a.target = '_blank';
            });

            return tempDiv.innerHTML;
        }

        // 表格布局处理
        function applyTableLayout(type) {
            currentTableLayout = type;
            const tables = document.querySelectorAll('#outputArea table');
            tables.forEach(table => {
                table.style.width = type === 'fixed' ? "100%" : "";
                table.style.whiteSpace = type === 'fixed' ? 'nowrap' : '';
            });
            updateSourceCode();
            showNotification(type === 'fixed' ? '🖥️ 表格已设置为页面自适应' : '📐 表格已设置为文字自适应');
        }

        // 取消表格缩进
        function removeTableIndent() {
            const outputArea = document.getElementById('outputArea');
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = outputArea.innerHTML;

            // 1. 移除表格前的空段落
            tempDiv.querySelectorAll('table').forEach(table => {
                let prev = table.previousElementSibling;
                while (prev && prev.tagName === 'P' && /^[\s　]*$/.test(prev.textContent)) {
                    prev.remove();
                    prev = table.previousElementSibling;
                }
            });

            // 2. 处理表格单元格内的p标签
            tempDiv.querySelectorAll('td, th').forEach(cell => {
                const pTags = cell.querySelectorAll('p');
                pTags.forEach(p => {
                    p.innerHTML = p.innerHTML.replace(/^[　\s]+/, '');
                    
                    const content = document.createElement('div');
                    content.innerHTML = p.innerHTML;
                    
                    while (content.firstChild) {
                        p.parentNode.insertBefore(content.firstChild, p);
                    }
                    
                    p.remove();
                });
            });

            outputArea.innerHTML = tempDiv.innerHTML;
            updateSourceCode();
            showNotification('📏 表格缩进已移除（包括表格内的p标签）');
        }

        // 添加学校图片
        function addSchoolImages() {
            const outputArea = document.getElementById('outputArea');
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = outputArea.innerHTML;

            tempDiv.querySelectorAll('h6').forEach(h6 => {
                const schoolName = h6.textContent.trim();
                const matchedImages = imageLibrary.filter(img => 
                    img.alt.includes(schoolName) || schoolName.includes(img.alt)
                );

                if (matchedImages.length > 0) {
                    const randomIndex = Math.floor(Math.random() * matchedImages.length);
                    const selectedImage = matchedImages[randomIndex];

                    const imgHTML = `
                        <p style="text-align: center;">
                            <img src="${selectedImage.src}" alt="${selectedImage.alt}">
                        </p>`;
                    
                    let nextSibling = h6.nextElementSibling;
                    let replaced = false;
                    
                    while (nextSibling) {
                        if (nextSibling.tagName === 'P' && nextSibling.querySelector('img')) {
                            nextSibling.outerHTML = imgHTML;
                            replaced = true;
                            break;
                        }
                        nextSibling = nextSibling.nextElementSibling;
                    }
                    
                    if (!replaced) {
                        h6.insertAdjacentHTML('afterend', imgHTML);
                    }
                }
            });

            outputArea.innerHTML = tempDiv.innerHTML;
            updateSourceCode();
        }
        
        // 更新源代码显示
        function updateSourceCode() {
            document.getElementById('sourceCode').textContent = 
                document.getElementById('outputArea').innerHTML;
        }

        // 显示通知
        function showNotification(message) {
            const div = document.createElement('div');
            div.className = 'notification';
            div.innerHTML = `<i class="fas fa-info-circle"></i> <span>${message}</span>`;
            document.body.appendChild(div);
            setTimeout(() => {
                div.classList.add('pulse');
            }, 10);
            setTimeout(() => {
                div.remove();
            }, 2500);
        }

        // 复制源码
        function copySource() {
            const textarea = document.createElement('textarea');
            textarea.value = document.getElementById('sourceCode').textContent;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showNotification('✅ 源代码已复制到剪贴板！');
        }

        // 导语样式处理函数
        function applyIntroStyle() {
            const outputArea = document.getElementById('outputArea');
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = outputArea.innerHTML;
            
            // 尝试找到现有的导语元素
            let existingDaoyu = tempDiv.querySelector('.yuloo_daoyu_box');
            let content = '';
            
            if (existingDaoyu) {
                const contentPara = existingDaoyu.querySelector('p:not(.yuloo_daoyu_tit)');
                if (contentPara) {
                    content = contentPara.innerHTML;
                }
                existingDaoyu.remove();
            } else {
                const paragraphs = tempDiv.querySelectorAll('p');
                for (let i = 0; i < paragraphs.length; i++) {
                    const p = paragraphs[i];
                    if (p.textContent.trim() !== '') {
                        content = p.innerHTML;
                        p.remove();
                        break;
                    }
                }
            }
            
            if (!content) {
                showNotification('⚠️ 未找到可设置导语的段落');
                return;
            }
            
            content = content.replace(/^[　\s]+/, '');
            
            // 导语样式库
            const introStyles = [
                `<section class="yuloo_daoyu_box yuloo_daoyu1">
                    <p class="yuloo_daoyu_tit">
                        导语<em>introduction</em>
                    </p>
                    <p>
                        ${content}
                    </p>
                </section>`,
                `<section class="yuloo_daoyu_box yuloo_daoyu2">
                    <p class="yuloo_daoyu_tit">
                        <span class="yuloo_daoyu_span">导语</span><em>introduction</em>

            outputArea.innerHTML = tempDiv.innerHTML;

        // 清除注释（从输出区域）
        function removeCommentsFromOutput() {
            let outputHTML = document.getElementById('outputArea').innerHTML;
            // 清除HTML注释
            outputHTML = outputHTML.replace(/<!--[\s\S]*?-->/g, '');
            document.getElementById('outputArea').innerHTML = outputHTML;
            updateSourceCode();
            showNotification('🧹 已清除HTML注释');
        }
        
        // 清除注释（源代码显示区域）
        function removeComments() {
            // 获取源代码内容
            const sourceCode = document.getElementById('sourceCode');
            let code = sourceCode.textContent;
            
            // 正则表达式匹配各种注释
            const commentPatterns = [
                // HTML注释 <!-- -->
                /<!--[\s\S]*?-->/g,
            ];
            
            // 清除所有匹配的注释
            commentPatterns.forEach(pattern => {
                code = code.replace(pattern, '');
            });
            
            // 更新源代码显示
            sourceCode.textContent = code;
            showNotification('🧹 注释已清除！');
        }
        

		
		 // 育路样式集成功能
        function yulooStyle() {
            // 应用样式前清除注释
            removeCommentsFromOutput();

            // 重置样式
            processContent()
            // 其他操作
            applyTitleStyles();
            applyIntroStyle();
            addSchoolImages();
            updateSourceCode();

            showNotification('育路样式已成功应用！');
        }

        // 粘贴事件处理
        document.getElementById('inputArea').addEventListener('paste', function(e) {
            e.preventDefault();
            const clipboardData = e.clipboardData || window.clipboardData;
            let html = clipboardData.getData('text/html');
            let text = clipboardData.getData('text/plain');
            
            if (html) {
                html = cleanFeishuSpecialSymbols(html);
                document.execCommand('insertHTML', false, html);
            } else {
                text = cleanFeishuSpecialSymbols(text);
                document.execCommand('insertText', false, text);
            }
        });

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            updateSourceCode();
        });
    </script>
